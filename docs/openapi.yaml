openapi: 3.1.0
info:
  title: t10-collab
  version: 0.2.0
  description: >
    Work items, offers and notifications. Every route but /mcp needs a person's
    bearer token, and the tenant comes from its tid. A forbidden item answers 404, the
    same as a missing one. Lists take limit (1 to 200, default 50) and cursor,
    and return next_cursor, which is empty on the last page.
security:
  - bearer: []
paths:
  /v1/module:
    get:
      summary: This module's manifest
      description: Routes and fields can only be added within an api_version.
      operationId: getManifest
      responses:
        "200":
          description: The manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  api_version: {type: integer}
                  action_prefix: {type: string}
                  enabled: {type: boolean}
                  features: {type: array, items: {type: string}}
        default: {$ref: "#/components/responses/Error"}
  /mcp:
    post:
      summary: Agent tools, over MCP
      description: >
        One JSON-RPC message per request: MCP over Streamable HTTP, with no
        session and no stream, so GET and DELETE answer 405. initialize, ping and
        tools/list need no token, because they hold nothing about a tenant.
        tools/call needs a delegated token listing t10-collab, with the tool's
        action on the token and on every grant in its chain. A refused or failed
        tool answers 200 with isError, for the model to read. A result's text is
        JSON inside one module_record tag, which marks it as data.
      operationId: postMcp
      security:
        - {}
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: A JSON-RPC response
          content:
            application/json:
              schema: {type: object}
        "202":
          description: A notification was accepted
        "400":
          description: The body isn't a JSON-RPC message
        "401":
          description: tools/call had no valid token
        "403":
          description: A browser's request, or a token that isn't delegated
  /docs/mcp:
    post:
      summary: This repo's docs, over MCP
      description: >
        The docs contract in the t10 workspace (contracts/docs): one JSON-RPC
        message per request, with no session, no stream and no token. It serves
        docs_overview, docs_search, docs_read, docs_api and docs_agent_tools, and
        each doc as a resource, from the docs for people building on t10 that the
        image carries. Other methods answer 405.
      operationId: postDocsMcp
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: A JSON-RPC response
          content:
            application/json:
              schema: {type: object}
        "202":
          description: A notification was accepted
        "400":
          description: The body isn't a JSON-RPC message
        "403":
          description: A browser's request
  /internal/v1/attention:
    get:
      summary: What needs one person, as counts
      description: Only t10-notify's service token can call this. It is never exposed publicly.
      operationId: getAttention
      parameters:
        - {name: tenant, in: query, required: true, schema: {type: string}}
        - {name: user, in: query, required: true, schema: {type: string}}
        - {name: since, in: query, description: "Start for new assignments and declines. Defaults to 24 hours ago.", schema: {type: string, format: date-time}}
      responses:
        "200":
          description: Counts, with no titles or names
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers_to_answer: {type: integer}
                  new_assignments: {type: integer}
                  due_soon: {type: integer}
                  overdue: {type: integer}
                  declined: {type: integer}
                  waiting_offers: {type: integer}
        default: {$ref: "#/components/responses/Error"}
  /internal/v1/types/{type}:
    put:
      summary: Declare an item type's default, from the module that owns it
      description: >-
        Only the owning module's service token, t10-<module> for a type <module>.<name>, can call this. The
        same version and definition again is a no-op, so every replica can push at start. A lower version, or
        the same one with a different definition, answers type_version_stale. visibility and departure can
        never change for a type ID. Unknown keys are refused. See docs/types.md.
      operationId: putType
      parameters:
        - {name: type, in: path, required: true, schema: {type: string}, description: "<module>.<name>; must match the body's id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TypeDefinition"}
      responses:
        "200":
          description: The type as stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Type"}
        default: {$ref: "#/components/responses/Error"}
  /internal/v1/types/{type}/tenants/{tenant}:
    parameters:
      - {name: type, in: path, required: true, schema: {type: string}}
      - {name: tenant, in: path, required: true, schema: {type: string}}
    put:
      summary: Tailor a type for one tenant, from the module that owns it
      description: >-
        Only the owning module's service token. The body is the whole type, at the version of the current
        default, which must be pushed first (type_default_missing). It may change labels, field titles and what
        moves require, and add fields; anything else answers invalid_type. Once a newer default is pushed, the
        tenant falls back to it until the module tailors that version.
      operationId: putTenantType
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TypeDefinition"}
      responses:
        "200":
          description: The tenant's version as stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Type"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Put the tenant back on the type's default
      operationId: deleteTenantType
      responses:
        "204": {description: Back on the default, or it already was}
        default: {$ref: "#/components/responses/Error"}
  /internal/v1/events:
    get:
      summary: The events about one module's typed items, for that module
      description: >-
        Only the module's own service token, t10-<module>, can call this. Events from every tenant, oldest
        first, paged by an <xid>.<seq> cursor that stops short of any transaction still running, so a slow
        commit arrives late rather than never. Keep the last cursor and pass it as after. See docs/types.md.
      operationId: moduleEvents
      parameters:
        - {name: module, in: query, required: true, schema: {type: string}}
        - {name: after, in: query, schema: {type: string}, description: "The last cursor read; empty from the start"}
        - {$ref: "#/components/parameters/limit"}
      responses:
        "200":
          description: One page, and the cursor to pass next, which stays put when there's nothing new
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        cursor: {type: string}
                        id: {type: string}
                        tenant: {type: string}
                        kind: {type: string}
                        item_id: {type: string}
                        type: {type: string}
                        actor: {type: string}
                        actor_grant: {type: string}
                        detail: {type: object, description: "As in the item's history: a move's from_state, to_state, note and payload"}
                        at: {type: string, format: date-time}
                        item:
                          type: object
                          description: The item as it is when the feed is read; left out once it's deleted
                          properties:
                            title: {type: string}
                            status: {$ref: "#/components/schemas/Status"}
                            state: {type: string}
                            fields: {type: object}
                            subject_ref: {type: string}
                            creator_id: {type: string}
                            owners: {type: array, items: {type: string}}
                            due_at: {type: [string, "null"], format: date-time}
                            pending_offers:
                              type: array
                              description: Offers nobody has answered, oldest first
                              items:
                                type: object
                                properties:
                                  id: {type: string}
                                  to_user_id: {type: string}
                                  mode: {type: string, enum: [transfer, share]}
                            version: {type: integer}
                  next: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /v1/types:
    get:
      summary: The item types in the caller's tenant, collab.task first
      operationId: listTypes
      responses:
        "200":
          description: Every type, so a client can draw any item's fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  types: {type: array, items: {$ref: "#/components/schemas/Type"}}
        default: {$ref: "#/components/responses/Error"}
  # The ontology contract's routes (the workspace's contracts/ontology/README.md),
  # served by t10-modkit's ontology package over collab's objects and actions
  # (docs/ontology.md). Their bodies and error codes are the contract's.
  /v1/ontology:
    get:
      summary: The ontology descriptor, with this tenant's layer
      description: Takes a person's token, or an agent's acting for one.
      operationId: getOntology
      responses:
        "200": {$ref: "#/components/responses/Ontology"}
        default: {$ref: "#/components/responses/Error"}
  /v1/objects/{type}/{id}:
    parameters:
      - {name: type, in: path, required: true, schema: {type: string, enum: [work_item, list, comment, offer]}}
      - {$ref: "#/components/parameters/id"}
    get:
      summary: One object the caller may read, with the actions on it
      operationId: getObject
      parameters:
        - {name: sources, in: query, schema: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/Ontology"}
        default: {$ref: "#/components/responses/Error"}
  /v1/objects/{type}/search:
    parameters:
      - {name: type, in: path, required: true, schema: {type: string, enum: [work_item, list, comment, offer]}}
    post:
      summary: Search one object type under collab's access policy
      description: The filter, sort, limit and cursor are the contract's. relation filters a work item by the caller's tie to it, such as owner.
      operationId: searchObjects
      requestBody: {$ref: "#/components/requestBodies/Ontology"}
      responses:
        "200": {$ref: "#/components/responses/Ontology"}
        default: {$ref: "#/components/responses/Error"}
  /v1/objects/{type}/{id}/links/{link}:
    parameters:
      - {name: type, in: path, required: true, schema: {type: string}}
      - {$ref: "#/components/parameters/id"}
      - {name: link, in: path, required: true, schema: {type: string}}
    get:
      summary: A page of one object's link
      operationId: followLink
      parameters:
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/cursor"}
      responses:
        "200": {$ref: "#/components/responses/Ontology"}
        default: {$ref: "#/components/responses/Error"}
  /v1/objects/resolve:
    post:
      summary: The titles of references the caller may read, leaving out the rest
      operationId: resolveObjects
      requestBody: {$ref: "#/components/requestBodies/Ontology"}
      responses:
        "200": {$ref: "#/components/responses/Ontology"}
        default: {$ref: "#/components/responses/Error"}
  /v1/actions/{action}/validate:
    parameters:
      - {name: action, in: path, required: true, schema: {type: string}}
    post:
      summary: Check an action without taking it
      operationId: validateAction
      requestBody: {$ref: "#/components/requestBodies/Ontology"}
      responses:
        "200": {$ref: "#/components/responses/Ontology"}
        default: {$ref: "#/components/responses/Error"}
  /v1/actions/{action}/apply:
    parameters:
      - {name: action, in: path, required: true, schema: {type: string}}
    post:
      summary: Take an action as the person, as its route would
      operationId: applyAction
      parameters:
        - {name: Idempotency-Key, in: header, schema: {type: string}}
      requestBody: {$ref: "#/components/requestBodies/Ontology"}
      responses:
        "200": {$ref: "#/components/responses/Ontology"}
        default: {$ref: "#/components/responses/Error"}
  /v1/undo/{id}:
    parameters:
      - {$ref: "#/components/parameters/id"}
    post:
      summary: Undo a task an assistant made, within a day and while nobody else is on it
      operationId: undoAction
      responses:
        "200": {$ref: "#/components/responses/Ontology"}
        default: {$ref: "#/components/responses/Error"}
  /v1/proposals:
    get:
      summary: The caller's open drafts
      operationId: listProposals
      responses:
        "200": {$ref: "#/components/responses/Ontology"}
        default: {$ref: "#/components/responses/Error"}
  /v1/proposals/{id}/confirm:
    parameters:
      - {$ref: "#/components/parameters/id"}
    post:
      summary: Take a draft as the person, under their rights now
      description: stale_revision when its object changed since the draft; give the current revision to confirm anyway.
      operationId: confirmProposal
      requestBody: {$ref: "#/components/requestBodies/Ontology"}
      responses:
        "200": {$ref: "#/components/responses/Ontology"}
        default: {$ref: "#/components/responses/Error"}
  /v1/proposals/{id}/dismiss:
    parameters:
      - {$ref: "#/components/parameters/id"}
    post:
      summary: Close a draft with no other effect
      operationId: dismissProposal
      responses:
        "204": {description: Dismissed}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items:
    post:
      summary: Create an item, optionally sending it at once
      operationId: createWorkItem
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewItem"}
      responses:
        "201": {$ref: "#/components/responses/Item"}
        default: {$ref: "#/components/responses/Error"}
    get:
      summary: List the items the caller can see
      operationId: listWorkItems
      parameters:
        - {name: view, in: query, schema: {type: string, enum: [owned, sent, collaborating, list, reports, claimable]}, description: "reports is empty unless the tenant's manager_visibility allows it. claimable is open, unowned items on the caller's unarchived lists"}
        - {name: list, in: query, schema: {type: string}, description: Required with view=list}
        - {name: status, in: query, schema: {type: string, enum: [todo, doing, done, cancelled, open]}, description: open is todo and doing}
        - {name: q, in: query, schema: {type: string, maxLength: 300}, description: Part of the title, ignoring case}
        - {name: due_from, in: query, schema: {type: string, format: date-time}, description: Due at or after this. Leaves out items with no due date}
        - {name: due_before, in: query, schema: {type: string, format: date-time}, description: Due before this. Leaves out items with no due date}
        - {name: type, in: query, schema: {type: string}, description: Only items of this type, such as collab.task}
        - {name: module, in: query, schema: {type: string}, description: Only items of this module's types}
        - {name: subject, in: query, schema: {type: string}, description: "Only items about this record, <module>:<type>:<id>"}
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/cursor"}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Item"}}
                  next_cursor: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}:
    parameters:
      - {$ref: "#/components/parameters/id"}
    get:
      summary: Read one item
      operationId: getWorkItem
      responses:
        "200":
          description: The item, and what the caller may do to it. A manager's read can do nothing.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Item"}
                  - type: object
                    properties:
                      moves:
                        type: array
                        description: The transitions of a typed item's type the caller may take now
                        items: {$ref: "#/components/schemas/Move"}
                      can:
                        type: object
                        properties:
                          edit: {type: boolean}
                          cancel: {type: boolean, description: Also covers reopening a cancelled item}
                          claim: {type: boolean}
                          send: {type: boolean}
                          delete: {type: boolean}
                          manage_people: {type: boolean, description: Add and remove collaborators}
                      pending_offers:
                        type: array
                        description: Offers on the item nobody has answered, oldest first
                        items: {$ref: "#/components/schemas/Offer"}
                      working:
                        type: array
                        description: Agent accounts expected to act on the item, its owners and those offered it, told about it in the last 15 minutes and not acting since
                        items:
                          type: object
                          properties:
                            user_id: {type: string}
                            since: {type: string, format: date-time}
                      mention:
                        type: object
                        description: The latest comment that mentioned the caller, if they've done nothing on the item since
                        properties:
                          from: {type: string}
                          body: {type: string}
                          at: {type: string, format: date-time}
        default: {$ref: "#/components/responses/Error"}
    patch:
      summary: Edit fields or status
      description: Needs the version the caller read. Fields left out stay as they are, and due_at takes null.
      operationId: updateWorkItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer}
                title: {type: string, maxLength: 300}
                description: {type: string, maxLength: 20000}
                priority: {$ref: "#/components/schemas/Priority"}
                status: {allOf: [{$ref: "#/components/schemas/Status"}], description: "Refused with transition_not_allowed on an item whose type has states"}
                due_at: {type: [string, "null"], format: date-time}
                fields: {type: object, description: "Merged into the type's values; null clears a key. Only fields the type declares now can be written"}
      responses:
        "200": {$ref: "#/components/responses/Item"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Soft delete, for any owner
      operationId: deleteWorkItem
      responses:
        "204": {description: Deleted}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/events:
    parameters:
      - {$ref: "#/components/parameters/id"}
    get:
      summary: Item history, oldest first
      operationId: listItemEvents
      parameters:
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/cursor"}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: {type: array, items: {$ref: "#/components/schemas/Event"}}
                  next_cursor: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/transition:
    parameters:
      - {$ref: "#/components/parameters/id"}
    post:
      summary: Take one of a typed item's transitions
      description: >-
        The move must be in the item's moves: declared from its state, for one of the caller's relations to it.
        A state the type moves to in a closed phase ends the item's offers, as a status change does.
      operationId: transitionWorkItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transition]
              properties:
                transition: {type: string}
                note: {type: string, maxLength: 2000}
                payload:
                  type: object
                  description: The move's result, as its payload allows
                  properties:
                    reply: {type: string, maxLength: 10000}
                    links:
                      type: array
                      maxItems: 20
                      items:
                        type: object
                        required: [url]
                        properties:
                          url: {type: string, description: https only}
                          title: {type: string, maxLength: 200}
                version: {type: integer, description: When given, must be the version the caller read}
      responses:
        "200": {$ref: "#/components/responses/Item"}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/claim:
    parameters:
      - {$ref: "#/components/parameters/id"}
    post:
      summary: Claim an unowned list item
      operationId: claimWorkItem
      responses:
        "200": {$ref: "#/components/responses/Item"}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/list:
    parameters:
      - {$ref: "#/components/parameters/id"}
    put:
      summary: Put an item the caller owns on a shared list they're on, or take it off with an empty list_id
      description: An item on a workflow leaves it. One put on a list whose workflow starts each new item starts at the first stage.
      operationId: setWorkItemList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [list_id]
              properties:
                list_id: {type: string}
      responses:
        "200": {$ref: "#/components/responses/Item"}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/owners/me:
    parameters:
      - {$ref: "#/components/parameters/id"}
    delete:
      summary: Stop being an owner
      operationId: stopOwning
      responses:
        "204": {description: No longer an owner}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/collaborators/{user}:
    parameters:
      - {$ref: "#/components/parameters/id"}
      - {name: user, in: path, required: true, schema: {type: string}}
    put:
      summary: Add a collaborator
      operationId: addCollaborator
      responses:
        "204": {description: Added}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Remove a collaborator
      operationId: removeCollaborator
      responses:
        "204": {description: Removed}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/comments:
    parameters:
      - {$ref: "#/components/parameters/id"}
    get:
      summary: Read comments, oldest first
      operationId: listComments
      parameters:
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/cursor"}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments: {type: array, items: {$ref: "#/components/schemas/Comment"}}
                  next_cursor: {type: string}
        default: {$ref: "#/components/responses/Error"}
    post:
      summary: Add a comment
      operationId: addComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, maxLength: 10000}
                mentions: {type: array, maxItems: 20, items: {type: string}, description: User IDs to tell, who must be able to read the item}
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Comment"}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/links:
    parameters:
      - {$ref: "#/components/parameters/id"}
    post:
      summary: Add a link
      description: >-
        For anyone who may edit the item, at most 20. A link points to where its work happens, such as the pull request an
        external agent teammate opened. Nothing fetches it. The people on the item are told, as for an edit.
      operationId: addLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, maxLength: 2000, description: An https URL with no credentials}
                title: {type: string, maxLength: 200, description: "Its host and path when left out"}
                kind: {type: string, enum: [pull_request, commit, build, document, other], description: "Guessed from the URL when left out, such as pull_request for a GitHub /pull/ or GitLab /merge_requests/ path, and other otherwise"}
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Link"}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/links/{link}:
    parameters:
      - {$ref: "#/components/parameters/id"}
      - {name: link, in: path, required: true, schema: {type: string}}
    delete:
      summary: Remove a link
      operationId: removeLink
      responses:
        "204": {description: Removed}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/send:
    parameters:
      - {$ref: "#/components/parameters/id"}
    post:
      summary: Send an item
      description: The result's state is pending for an offer, or assigned when the recipient is beneath the sender. The service decides, not the client.
      operationId: sendWorkItem
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Send"}
      responses:
        "201": {$ref: "#/components/responses/Offer"}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/advance:
    parameters:
      - {$ref: "#/components/parameters/id"}
    post:
      summary: Finish the caller's stage of an item on its list's workflow
      description: pass moves it to the next stage's holder, or marks it done after the last stage; changes sends it back to the stage's on_changes stage, or to the workflow's lead past its rounds. A pass with to goes to a later stage over stages that may be skipped. See docs/workflows.md.
      operationId: advanceWorkItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: {type: string, enum: [pass, changes]}
                note: {type: string, maxLength: 2000, description: Needed with changes, to say what to fix, and with to, to say why the stages skipped don't apply}
                to: {type: string, description: With pass, a stage from the item's workflow skip list}
      responses:
        "200": {$ref: "#/components/responses/Item"}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/stage:
    parameters:
      - {$ref: "#/components/parameters/id"}
    post:
      summary: Start an item on its list's workflow, or put it at a stage
      description: An owner of an item off the workflow may start it, and any list member may start an item nobody owns at the first stage; a list owner may put it at any stage. Its rounds start over.
      operationId: putWorkItemAtStage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stage: {type: string, description: The first stage when left out}
                note: {type: string, maxLength: 2000}
      responses:
        "200": {$ref: "#/components/responses/Item"}
        default: {$ref: "#/components/responses/Error"}
  /v1/offers:
    get:
      summary: Pending offers to the caller, or everything they sent
      operationId: listOffers
      parameters:
        - {name: box, in: query, required: true, schema: {type: string, enum: [inbox, sent]}}
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/cursor"}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers: {type: array, items: {$ref: "#/components/schemas/Offer"}}
                  next_cursor: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /v1/offers/{id}/accept:
    parameters:
      - {$ref: "#/components/parameters/id"}
    post:
      summary: Accept, for the recipient
      operationId: acceptOffer
      responses:
        "200": {$ref: "#/components/responses/Offer"}
        default: {$ref: "#/components/responses/Error"}
  /v1/offers/{id}/decline:
    parameters:
      - {$ref: "#/components/parameters/id"}
    post:
      summary: Decline, for the recipient
      operationId: declineOffer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string, maxLength: 2000}
      responses:
        "200": {$ref: "#/components/responses/Offer"}
        default: {$ref: "#/components/responses/Error"}
  /v1/offers/{id}/withdraw:
    parameters:
      - {$ref: "#/components/parameters/id"}
    post:
      summary: Withdraw, for the sender or any owner
      operationId: withdrawOffer
      responses:
        "200": {$ref: "#/components/responses/Offer"}
        default: {$ref: "#/components/responses/Error"}
  /v1/lists:
    get:
      summary: The lists the caller is on
      operationId: listLists
      parameters:
        - {name: archived, in: query, schema: {type: boolean, default: false}}
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/cursor"}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  lists: {type: array, items: {$ref: "#/components/schemas/List"}}
                  next_cursor: {type: string}
        default: {$ref: "#/components/responses/Error"}
    post:
      summary: Create a list owned by the caller
      operationId: createList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 200}
      responses:
        "201": {$ref: "#/components/responses/List"}
        default: {$ref: "#/components/responses/Error"}
  /v1/lists/{id}:
    parameters:
      - {$ref: "#/components/parameters/id"}
    get:
      summary: Read a list and its members
      operationId: getList
      responses:
        "200": {$ref: "#/components/responses/List"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      summary: Rename, archive, or set or clear a unit link
      operationId: updateList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 200}
                archived: {type: boolean}
                org_unit_id: {type: string, description: Empty clears the link}
      responses:
        "200": {$ref: "#/components/responses/List"}
        default: {$ref: "#/components/responses/Error"}
  /v1/lists/{id}/members/{user}:
    parameters:
      - {$ref: "#/components/parameters/id"}
      - {name: user, in: path, required: true, schema: {type: string}}
    put:
      summary: Add a member or change their role, which also makes them manual
      operationId: putListMember
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: {type: string, enum: [owner, member], default: member}
      responses:
        "204": {description: Saved}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Remove a member, as a list owner, or leave the list as yourself. An org member answers managed_by_unit
      operationId: removeListMember
      responses:
        "204": {description: Removed}
        default: {$ref: "#/components/responses/Error"}
  /v1/lists/{id}/holding:
    parameters:
      - {$ref: "#/components/parameters/id"}
    put:
      summary: Agree to hold stages of the list's workflow, as a person who is a plain member
      description: Until they agree, moves pass them over. Owners and agent accounts need not agree.
      operationId: holdListStages
      responses:
        "204": {description: Agreed}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: No longer hold stages of the list's workflow; items held now stay
      operationId: stopHoldingListStages
      responses:
        "204": {description: Stopped}
        default: {$ref: "#/components/responses/Error"}
  /v1/lists/{id}/workflow:
    parameters:
      - {$ref: "#/components/parameters/id"}
    put:
      summary: Set the list's workflow, as a list owner
      description: Every holder must be on the list, and every agent holder take work from it; the lead is a list owner. Items at a stage left out leave the workflow and stay with their holders.
      operationId: setListWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stages]
              properties:
                stages: {type: array, minItems: 1, maxItems: 12, items: {$ref: "#/components/schemas/Stage"}}
                rounds: {type: integer, minimum: 1, maximum: 20, default: 3}
                lead: {type: string, description: The caller when left out}
                auto_start: {type: boolean, description: Start each new item on the list at the first stage}
      responses:
        "200":
          description: The workflow
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Workflow"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Remove the list's workflow, as a list owner; its items stay with their holders
      operationId: removeListWorkflow
      responses:
        "204": {description: Removed}
        default: {$ref: "#/components/responses/Error"}
  /v1/people:
    get:
      summary: Find an active teammate by display name
      operationId: findPeople
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: unit, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/cursor"}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  people:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: {type: string}
                        display_name: {type: string, description: Unverified. Can be empty}
                        agent: {type: boolean, description: An agent teammate. Left out for a person}
                        org_unit_id: {type: string}
                  next_cursor: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /v1/units:
    get:
      summary: The tenant's org units
      operationId: listUnits
      responses:
        "200":
          description: The units
          content:
            application/json:
              schema:
                type: object
                properties:
                  units:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        parent_id: {type: string}
                        name: {type: string}
                        kind: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /v1/notifications:
    get:
      summary: Notifications after a cursor, oldest first
      description: Poll about every 30 seconds with the cursor from the last response.
      operationId: listNotifications
      parameters:
        - {name: after, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/limit"}
      responses:
        "200":
          description: New notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        read_at: {type: [string, "null"], format: date-time}
                        event: {$ref: "#/components/schemas/Event"}
                        target: {type: string, description: "The record this is about, as <module>:<type>:<id>"}
                  cursor: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /v1/notifications/read:
    post:
      summary: Mark the caller's notifications as read
      operationId: markNotificationsRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, items: {type: string}}
      responses:
        "204": {description: Marked}
        default: {$ref: "#/components/responses/Error"}
  /v1/settings:
    get:
      summary: Read tenant settings, for any member
      operationId: getSettings
      responses:
        "200": {$ref: "#/components/responses/Settings"}
        default: {$ref: "#/components/responses/Error"}
  /v1/admin/settings:
    put:
      summary: Change tenant settings, for a module admin
      operationId: putSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Settings"}
      responses:
        "200": {$ref: "#/components/responses/Settings"}
        default: {$ref: "#/components/responses/Error"}
  /v1/admin/agents/{user}/intake:
    parameters:
      - {name: user, in: path, required: true, schema: {type: string}, description: An agent account's user ID, which starts with acc_}
    get:
      summary: Who may offer work to an agent account, for a module admin
      description: An agent account's reporting line can always assign it work. With nothing set, nobody else can offer it any. A user who isn't an agent account answers 404.
      operationId: getAgentIntake
      responses:
        "200": {$ref: "#/components/responses/Intake"}
        default: {$ref: "#/components/responses/Error"}
    put:
      summary: Replace who may offer work to an agent account, for a module admin
      description: A unit takes work from members of the units beneath it too, and a list from its members. Each list must exist. Sends to the account that nobody here allows answer 403 not_accepting.
      operationId: putAgentIntake
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Intake"}
      responses:
        "200": {$ref: "#/components/responses/Intake"}
        default: {$ref: "#/components/responses/Error"}
  /v1/admin/intake-lists:
    get:
      summary: Shared lists an agent account's intake can name, for a module admin
      description: Every shared list in the tenant by name, open ones first, up to 500, including lists the admin isn't on. Names and IDs only, nothing of their items.
      operationId: listIntakeLists
      responses:
        "200":
          description: The lists
          content:
            application/json:
              schema:
                type: object
                required: [lists]
                properties:
                  lists:
                    type: array
                    items:
                      type: object
                      required: [id, name, archived]
                      properties:
                        id: {type: string}
                        name: {type: string}
                        archived: {type: boolean}
        default: {$ref: "#/components/responses/Error"}
  /v1/admin/departures:
    get:
      summary: Items nobody can act on, oldest first, for a module admin
      description: Titles and owners only. Closed items stay out, and come back if someone reopens them.
      operationId: listItemQueue
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/limit"}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/QueuedItem"}}
                  next_cursor: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /v1/admin/departures/{item}/reassign:
    post:
      summary: Give a queued item a new owner, for a module admin
      description: Needs no acceptance. Replaces every owner, and a suspended owner stays on as a collaborator. Anything not in the queue answers 404.
      operationId: reassignItem
      parameters:
        - {name: item, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewOwner"}
      responses:
        "200":
          description: Reassigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  title: {type: string}
                  owners: {type: array, items: {type: string}}
        default: {$ref: "#/components/responses/Error"}
  /v1/admin/departures/lists:
    get:
      summary: Lists nobody can manage, oldest first, for a module admin
      operationId: listListQueue
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/limit"}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  lists: {type: array, items: {$ref: "#/components/schemas/QueuedList"}}
                  next_cursor: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /v1/admin/departures/lists/{id}/owner:
    post:
      summary: Give a queued list a new owner, for a module admin
      description: Anything not in the queue answers 404.
      operationId: setListOwner
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewOwner"}
      responses:
        "204": {description: Done}
        default: {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  parameters:
    id: {name: id, in: path, required: true, schema: {type: string}}
    limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    cursor: {name: cursor, in: query, schema: {type: string}}
  requestBodies:
    Ontology:
      description: The ontology contract's body for this route
      content:
        application/json:
          schema: {type: object}
  responses:
    Ontology:
      description: The ontology contract's answer for this route
      content:
        application/json:
          schema: {type: object}
    Item:
      description: The item
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Item"}
    List:
      description: The list
      content:
        application/json:
          schema: {$ref: "#/components/schemas/List"}
    Intake:
      description: Who may offer work to an agent account
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Intake"}
    Settings:
      description: The settings
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Settings"}
    Offer:
      description: The offer
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Offer"}
    Error:
      description: An error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {$ref: "#/components/schemas/ErrorCode"}
              message: {type: string}
  schemas:
    Intake:
      type: object
      properties:
        user_id: {type: string, readOnly: true}
        everyone: {type: boolean, description: Anyone in the tenant may offer it work}
        units: {type: array, maxItems: 50, items: {type: string}, description: Members of these org units and the units beneath them}
        lists: {type: array, maxItems: 50, items: {type: string}, description: Members of these shared lists}
    Status: {type: string, enum: [todo, doing, done, cancelled]}
    Priority: {type: string, enum: [low, normal, high]}
    NewItem:
      type: object
      required: [title]
      properties:
        title: {type: string, maxLength: 300}
        description: {type: string, maxLength: 20000}
        priority: {$ref: "#/components/schemas/Priority"}
        due_at: {type: string, format: date-time}
        client_ref: {type: string, description: A retry with the same value returns the first item}
        send: {$ref: "#/components/schemas/Send"}
        list_id: {type: string, description: Puts the item on a list the caller is on}
        unowned: {type: boolean, description: Starts a list item with no owner}
        type: {type: string, description: "A module's item type, <module>.<name>; collab.task when left out"}
        fields: {type: object, description: "The type's values, checked against it"}
        subject_ref: {type: string, maxLength: 300, description: "The record it's about, <module>:<type>:<id>, of a kind the type takes"}
    TypeField:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [string, integer, number, boolean]}
        title: {type: string, maxLength: 100}
        maxLength: {type: integer, maximum: 20000, description: For strings; 2000 when left out}
        enum: {type: array, maxItems: 100, items: {}}
    TypeDefinition:
      type: object
      required: [id, owner_module, version, label]
      properties:
        id: {type: string, description: "<module>.<name>"}
        owner_module: {type: string}
        version: {type: integer, minimum: 1}
        label: {type: string, maxLength: 100}
        fields:
          type: object
          properties:
            type: {type: string, enum: [object]}
            properties: {type: object, additionalProperties: {$ref: "#/components/schemas/TypeField"}}
            order: {type: array, items: {type: string}, description: The order clients show fields in; the declared order when left out}
        subject: {type: array, maxItems: 20, items: {type: string}, description: "Kinds of record an item can be about, <module>:<type>"}
        visibility: {type: string, enum: [team, participants], default: team}
        departure: {type: string, enum: [reassign, creator, cancel], description: "reassign by default; creator for participants, which can't reassign"}
        states:
          type: object
          description: A lifecycle of its own. Each state counts as one of collab's statuses, its phase
          additionalProperties:
            type: object
            required: [phase, label]
            properties:
              phase: {$ref: "#/components/schemas/Status"}
              label: {type: string, maxLength: 100}
        state_order: {type: array, items: {type: string}, description: The order clients show states in; the declared order when left out}
        initial: {type: string, description: A todo or doing state new items start in}
        cancelled: {type: string, description: The cancelled state collab moves an item to itself, as when its owners leave; needed unless departure is reassign}
        offers:
          type: object
          description: What transfer offer events do to the state. A share send never moves it
          properties:
            send: {$ref: "#/components/schemas/OfferMove"}
            assign: {$ref: "#/components/schemas/OfferMove"}
            accept: {$ref: "#/components/schemas/OfferMove"}
            decline: {$ref: "#/components/schemas/OfferMove"}
            withdraw: {$ref: "#/components/schemas/OfferMove"}
        transitions: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/Transition"}}
    OfferMove:
      type: object
      required: [to]
      properties:
        from: {type: array, items: {type: string}, description: "For accept, decline and withdraw, the state send moves to when left out"}
        to: {type: string}
        requires: {type: array, items: {type: string}, description: Fields that must be filled; send and assign only}
        note: {type: string, enum: [required], description: decline only}
    Transition:
      type: object
      required: [id, from, to, by]
      properties:
        id: {type: string}
        label: {type: string, maxLength: 100}
        from: {type: array, items: {type: string}}
        to: {type: string}
        by:
          oneOf:
            - {type: string, enum: [creator, owner, collaborator, recipient, list_member]}
            - {type: array, items: {type: string, enum: [creator, owner, collaborator, recipient, list_member]}}
        requires: {type: array, items: {type: string}, description: Fields that must be filled, or payload keys that must be given}
        payload: {type: array, items: {type: string, enum: [reply, links]}}
        note: {type: string, enum: [required]}
    Move:
      type: object
      properties:
        id: {type: string}
        label: {type: string}
        to: {type: string}
        requires: {type: array, items: {type: string}}
        payload: {type: array, items: {type: string}}
        note: {type: string, enum: [required]}
    Type:
      allOf:
        - {$ref: "#/components/schemas/TypeDefinition"}
        - type: object
          properties:
            updated_at: {type: string, format: date-time}
    List:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        org_unit_id: {type: string}
        created_at: {type: string, format: date-time}
        archived_at: {type: [string, "null"], format: date-time}
        members:
          type: array
          description: Filled on a single read
          items:
            type: object
            properties:
              user_id: {type: string}
              role: {type: string, enum: [owner, member]}
              source: {type: string, enum: [manual, org]}
              holds: {type: boolean, description: A plain member who agreed to hold stages of the workflow}
        counts:
          type: object
          description: Filled on the caller's page of lists
          properties:
            open: {type: integer, description: Items to do or in progress}
            unclaimed: {type: integer, description: Open items nobody owns}
            members: {type: integer}
        has_workflow: {type: boolean, description: Filled on the caller's page of lists}
        workflow: {$ref: "#/components/schemas/Workflow"}
    Stage:
      type: object
      required: [name]
      properties:
        id: {type: string, description: Kept across edits; left out for a new stage}
        name: {type: string, maxLength: 60}
        holders: {type: array, minItems: 1, maxItems: 8, items: {type: string}, description: List members, people or agents; the item goes to the one that held it before, or else the one with the fewest open items on the list}
        holder: {type: string, description: The first of holders; on input, one holder when holders is left out}
        skip_when: {type: string, maxLength: 300, description: When the holder before may pass over this stage; not on the first stage}
        on_changes: {type: string, description: An earlier stage an item goes back to when its holder finds something}
        guide: {type: string, maxLength: 2000}
    Workflow:
      type: object
      properties:
        list_id: {type: string}
        version: {type: integer}
        stages: {type: array, items: {$ref: "#/components/schemas/Stage"}}
        rounds: {type: integer, description: How many times an item may go back before it goes to the lead}
        lead: {type: string}
        auto_start: {type: boolean}
        updated_by: {type: string}
        updated_at: {type: string, format: date-time}
    Step:
      type: object
      properties:
        stage: {type: string}
        name: {type: string}
        to: {type: string, description: Left out when the stage has several holders}
        holders: {type: array, items: {type: string}}
        skips: {type: array, items: {type: string}, description: The stages a skip passes over}
        done: {type: boolean}
        reason: {type: string, enum: [rounds, holder_gone]}
    Settings:
      type: object
      required: [manager_visibility]
      properties:
        manager_visibility: {type: string, enum: [none, direct_reports, all_reports]}
    NewOwner:
      type: object
      required: [to]
      properties:
        to: {type: string, description: An active member of the tenant}
    QueuedItem:
      type: object
      properties:
        id: {type: string}
        title: {type: string}
        status: {$ref: "#/components/schemas/Status"}
        owners: {type: array, items: {type: string}}
        reason: {type: string, enum: [no_successor, owner_suspended]}
        queued_at: {type: string, format: date-time}
    QueuedList:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        reason: {type: string, enum: [no_active_owner, no_active_members]}
        queued_at: {type: string, format: date-time}
    Send:
      type: object
      required: [to]
      properties:
        to: {type: string}
        mode: {type: string, enum: [transfer, share], default: transfer}
        note: {type: string, maxLength: 2000}
        client_ref: {type: string, description: A retry with the same value returns the first send}
    Item:
      type: object
      properties:
        id: {type: string}
        title: {type: string}
        description: {type: string}
        status: {$ref: "#/components/schemas/Status"}
        priority: {$ref: "#/components/schemas/Priority"}
        due_at: {type: [string, "null"], format: date-time}
        creator_id: {type: string}
        list_id: {type: string}
        version: {type: integer}
        owners: {type: array, items: {type: string}}
        collaborators: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        links: {type: array, items: {$ref: "#/components/schemas/Link"}}
        stage: {type: string, description: Its stage on its list's workflow; left out off it}
        rounds: {type: integer, description: Times it went back since it was started or put at a stage}
        type: {type: string, description: collab.task unless a module's}
        type_version: {type: integer, description: The type version it was last written under}
        state: {type: string, description: "Where it is in its type's lifecycle, when the type has states; status is then the state's phase"}
        fields: {type: object, description: "The type's values, including any an earlier version declared, which are read-only"}
        subject_ref: {type: string, description: "The record it's about; holding it grants nothing"}
        visibility: {type: string, enum: [team, participants], description: "participants: only its creator, owners and the recipient of a pending offer read it"}
        workflow:
          type: object
          description: On a single read of an item on a list with a workflow
          properties:
            workflow: {$ref: "#/components/schemas/Workflow"}
            stage: {oneOf: [{$ref: "#/components/schemas/Stage"}, {type: "null"}]}
            pass: {$ref: "#/components/schemas/Step"}
            changes: {$ref: "#/components/schemas/Step"}
            skip: {type: array, items: {$ref: "#/components/schemas/Step"}, description: Later stages a pass may go to instead}
            rounds: {type: integer}
    Link:
      type: object
      properties:
        id: {type: string}
        url: {type: string}
        title: {type: string}
        kind: {type: string, enum: [pull_request, commit, build, document, other]}
        added_by: {type: string}
        created_at: {type: string, format: date-time}
    Offer:
      type: object
      properties:
        id: {type: string}
        item_id: {type: string}
        item_title: {type: string, description: Empty once the caller can't see the item}
        from_user_id: {type: string, description: "system:sweep when a departed owner's item is being offered on"}
        to_user_id: {type: string}
        mode: {type: string, enum: [transfer, share]}
        note: {type: string}
        state: {type: string, enum: [pending, assigned, accepted, declined, withdrawn, voided, expired]}
        expires_at: {type: [string, "null"], format: date-time, description: Set only on an offer holding a departed owner's item}
        response_note: {type: string}
        responded_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        item:
          type: object
          description: Given only by accept and decline, the item as the answer left it, since someone who declines may no longer read it
          properties:
            status: {$ref: "#/components/schemas/Status"}
            state: {type: string}
            version: {type: integer}
    Comment:
      type: object
      properties:
        id: {type: string}
        author_id: {type: string}
        body: {type: string}
        created_at: {type: string, format: date-time}
    Event:
      type: object
      properties:
        id: {type: string}
        item_id: {type: string}
        actor_user_id: {type: string}
        actor_grant_id: {type: string, description: "Set when an agent acted for the person"}
        kind: {type: string}
        detail: {type: object}
        at: {type: string, format: date-time}
    ErrorCode:
      type: string
      enum:
        - agent_loop
        - already_owned
        - already_owner
        - client_ref_reused
        - forbidden
        - internal_error
        - invalid_recipient
        - invalid_request
        - invalid_token
        - item_closed
        - invalid_unit
        - last_list_owner
        - last_owner
        - list_archived
        - too_many_links
        - managed_by_unit
        - not_accepting
        - not_for_type
        - unknown_type
        - invalid_type
        - type_version_stale
        - type_fixed
        - transition_not_allowed
        - requirements_unmet
        - typed_item_not_on_workflow
        - type_default_missing
        - not_found
        - not_on_list
        - holder_not_accepting
        - not_on_workflow
        - no_way_back
        - cant_skip
        - offer_exists
        - offer_not_pending
        - org_unavailable
        - rate_limited
        - version_conflict
