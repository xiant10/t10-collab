openapi: 3.1.0
info:
  title: t10-collab
  version: 0.2.0
  description: >
    Work items, offers and notifications. Every route but /mcp needs a person's
    bearer token, and the tenant comes from its tid. A forbidden item answers 404, the
    same as a missing one. Lists take limit (1 to 200, default 50) and cursor,
    and return next_cursor, which is empty on the last page.
security:
  - bearer: []
paths:
  /v1/module:
    get:
      summary: This module's manifest
      description: Routes and fields can only be added within an api_version.
      operationId: getManifest
      responses:
        "200":
          description: The manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  api_version: {type: integer}
                  action_prefix: {type: string}
                  enabled: {type: boolean}
                  features: {type: array, items: {type: string}}
        default: {$ref: "#/components/responses/Error"}
  /mcp:
    post:
      summary: Agent tools, over MCP
      description: >
        One JSON-RPC message per request: MCP over Streamable HTTP, with no
        session and no stream, so GET and DELETE answer 405. initialize, ping and
        tools/list need no token, because they hold nothing about a tenant.
        tools/call needs a delegated token listing t10-collab, with the tool's
        action on the token and on every grant in its chain. A refused or failed
        tool answers 200 with isError, for the model to read. A result's text is
        JSON inside one module_record tag, which marks it as data.
      operationId: postMcp
      security:
        - {}
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: A JSON-RPC response
          content:
            application/json:
              schema: {type: object}
        "202":
          description: A notification was accepted
        "400":
          description: The body isn't a JSON-RPC message
        "401":
          description: tools/call had no valid token
        "403":
          description: A browser's request, or a token that isn't delegated
  /internal/v1/attention:
    get:
      summary: What needs one person, as counts
      description: Only t10-notify's service token can call this. It is never exposed publicly.
      operationId: getAttention
      parameters:
        - {name: tenant, in: query, required: true, schema: {type: string}}
        - {name: user, in: query, required: true, schema: {type: string}}
        - {name: since, in: query, description: "Start for new assignments and declines. Defaults to 24 hours ago.", schema: {type: string, format: date-time}}
      responses:
        "200":
          description: Counts, with no titles or names
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers_to_answer: {type: integer}
                  new_assignments: {type: integer}
                  due_soon: {type: integer}
                  overdue: {type: integer}
                  declined: {type: integer}
                  waiting_offers: {type: integer}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items:
    post:
      summary: Create an item, optionally sending it at once
      operationId: createWorkItem
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewItem"}
      responses:
        "201": {$ref: "#/components/responses/Item"}
        default: {$ref: "#/components/responses/Error"}
    get:
      summary: List the items the caller can see
      operationId: listWorkItems
      parameters:
        - {name: view, in: query, schema: {type: string, enum: [owned, sent, collaborating, list, reports, claimable]}, description: "reports is empty unless the tenant's manager_visibility allows it. claimable is open, unowned items on the caller's unarchived lists"}
        - {name: list, in: query, schema: {type: string}, description: Required with view=list}
        - {name: status, in: query, schema: {type: string, enum: [todo, doing, done, cancelled, open]}, description: open is todo and doing}
        - {name: q, in: query, schema: {type: string, maxLength: 300}, description: Part of the title, ignoring case}
        - {name: due_from, in: query, schema: {type: string, format: date-time}, description: Due at or after this. Leaves out items with no due date}
        - {name: due_before, in: query, schema: {type: string, format: date-time}, description: Due before this. Leaves out items with no due date}
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/cursor"}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Item"}}
                  next_cursor: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}:
    parameters:
      - {$ref: "#/components/parameters/id"}
    get:
      summary: Read one item
      operationId: getWorkItem
      responses:
        "200":
          description: The item, and what the caller may do to it. A manager's read can do nothing.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Item"}
                  - type: object
                    properties:
                      can:
                        type: object
                        properties:
                          edit: {type: boolean}
                          cancel: {type: boolean, description: Also covers reopening a cancelled item}
                          claim: {type: boolean}
                          send: {type: boolean}
                          delete: {type: boolean}
                          manage_people: {type: boolean, description: Add and remove collaborators}
                      pending_offers:
                        type: array
                        description: Offers on the item nobody has answered, oldest first
                        items: {$ref: "#/components/schemas/Offer"}
                      working:
                        type: array
                        description: Agent accounts expected to act on the item, its owners and those offered it, told about it in the last 15 minutes and not acting since
                        items:
                          type: object
                          properties:
                            user_id: {type: string}
                            since: {type: string, format: date-time}
                      mention:
                        type: object
                        description: The latest comment that mentioned the caller, if they've done nothing on the item since
                        properties:
                          from: {type: string}
                          body: {type: string}
                          at: {type: string, format: date-time}
        default: {$ref: "#/components/responses/Error"}
    patch:
      summary: Edit fields or status
      description: Needs the version the caller read. Fields left out stay as they are, and due_at takes null.
      operationId: updateWorkItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer}
                title: {type: string, maxLength: 300}
                description: {type: string, maxLength: 20000}
                priority: {$ref: "#/components/schemas/Priority"}
                status: {$ref: "#/components/schemas/Status"}
                due_at: {type: [string, "null"], format: date-time}
      responses:
        "200": {$ref: "#/components/responses/Item"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Soft delete, for any owner
      operationId: deleteWorkItem
      responses:
        "204": {description: Deleted}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/events:
    parameters:
      - {$ref: "#/components/parameters/id"}
    get:
      summary: Item history, oldest first
      operationId: listItemEvents
      parameters:
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/cursor"}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: {type: array, items: {$ref: "#/components/schemas/Event"}}
                  next_cursor: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/claim:
    parameters:
      - {$ref: "#/components/parameters/id"}
    post:
      summary: Claim an unowned list item
      operationId: claimWorkItem
      responses:
        "200": {$ref: "#/components/responses/Item"}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/owners/me:
    parameters:
      - {$ref: "#/components/parameters/id"}
    delete:
      summary: Stop being an owner
      operationId: stopOwning
      responses:
        "204": {description: No longer an owner}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/collaborators/{user}:
    parameters:
      - {$ref: "#/components/parameters/id"}
      - {name: user, in: path, required: true, schema: {type: string}}
    put:
      summary: Add a collaborator
      operationId: addCollaborator
      responses:
        "204": {description: Added}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Remove a collaborator
      operationId: removeCollaborator
      responses:
        "204": {description: Removed}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/comments:
    parameters:
      - {$ref: "#/components/parameters/id"}
    get:
      summary: Read comments, oldest first
      operationId: listComments
      parameters:
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/cursor"}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments: {type: array, items: {$ref: "#/components/schemas/Comment"}}
                  next_cursor: {type: string}
        default: {$ref: "#/components/responses/Error"}
    post:
      summary: Add a comment
      operationId: addComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, maxLength: 10000}
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Comment"}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/links:
    parameters:
      - {$ref: "#/components/parameters/id"}
    post:
      summary: Add a link
      description: >-
        For anyone who may edit the item, at most 20. A link points to where its work happens, such as the pull request an
        external agent teammate opened. Nothing fetches it. The people on the item are told, as for an edit.
      operationId: addLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, maxLength: 2000, description: An https URL with no credentials}
                title: {type: string, maxLength: 200, description: "Its host and path when left out"}
                kind: {type: string, enum: [pull_request, commit, build, document, other], description: "Guessed from the URL when left out, such as pull_request for a GitHub /pull/ or GitLab /merge_requests/ path, and other otherwise"}
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Link"}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/links/{link}:
    parameters:
      - {$ref: "#/components/parameters/id"}
      - {name: link, in: path, required: true, schema: {type: string}}
    delete:
      summary: Remove a link
      operationId: removeLink
      responses:
        "204": {description: Removed}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/send:
    parameters:
      - {$ref: "#/components/parameters/id"}
    post:
      summary: Send an item
      description: The result's state is pending for an offer, or assigned when the recipient is beneath the sender. The service decides, not the client.
      operationId: sendWorkItem
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Send"}
      responses:
        "201": {$ref: "#/components/responses/Offer"}
        default: {$ref: "#/components/responses/Error"}
  /v1/work-items/{id}/suggestion:
    parameters:
      - {$ref: "#/components/parameters/id"}
    delete:
      summary: Dismiss a suggested send
      description: For someone who could make the send. An assistant suggests one with the work_suggest tool, or suggest_to on work_create, because only a person sends.
      operationId: dismissSuggestion
      responses:
        "204": {description: Dismissed, or there was none}
        default: {$ref: "#/components/responses/Error"}
  /v1/offers:
    get:
      summary: Pending offers to the caller, or everything they sent
      operationId: listOffers
      parameters:
        - {name: box, in: query, required: true, schema: {type: string, enum: [inbox, sent]}}
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/cursor"}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers: {type: array, items: {$ref: "#/components/schemas/Offer"}}
                  next_cursor: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /v1/offers/{id}/accept:
    parameters:
      - {$ref: "#/components/parameters/id"}
    post:
      summary: Accept, for the recipient
      operationId: acceptOffer
      responses:
        "200": {$ref: "#/components/responses/Offer"}
        default: {$ref: "#/components/responses/Error"}
  /v1/offers/{id}/decline:
    parameters:
      - {$ref: "#/components/parameters/id"}
    post:
      summary: Decline, for the recipient
      operationId: declineOffer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string, maxLength: 2000}
      responses:
        "200": {$ref: "#/components/responses/Offer"}
        default: {$ref: "#/components/responses/Error"}
  /v1/offers/{id}/withdraw:
    parameters:
      - {$ref: "#/components/parameters/id"}
    post:
      summary: Withdraw, for the sender or any owner
      operationId: withdrawOffer
      responses:
        "200": {$ref: "#/components/responses/Offer"}
        default: {$ref: "#/components/responses/Error"}
  /v1/lists:
    get:
      summary: The lists the caller is on
      operationId: listLists
      parameters:
        - {name: archived, in: query, schema: {type: boolean, default: false}}
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/cursor"}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  lists: {type: array, items: {$ref: "#/components/schemas/List"}}
                  next_cursor: {type: string}
        default: {$ref: "#/components/responses/Error"}
    post:
      summary: Create a list owned by the caller
      operationId: createList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 200}
      responses:
        "201": {$ref: "#/components/responses/List"}
        default: {$ref: "#/components/responses/Error"}
  /v1/lists/{id}:
    parameters:
      - {$ref: "#/components/parameters/id"}
    get:
      summary: Read a list and its members
      operationId: getList
      responses:
        "200": {$ref: "#/components/responses/List"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      summary: Rename, archive, or set or clear a unit link
      operationId: updateList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 200}
                archived: {type: boolean}
                org_unit_id: {type: string, description: Empty clears the link}
      responses:
        "200": {$ref: "#/components/responses/List"}
        default: {$ref: "#/components/responses/Error"}
  /v1/lists/{id}/members/{user}:
    parameters:
      - {$ref: "#/components/parameters/id"}
      - {name: user, in: path, required: true, schema: {type: string}}
    put:
      summary: Add a member or change their role, which also makes them manual
      operationId: putListMember
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: {type: string, enum: [owner, member], default: member}
      responses:
        "204": {description: Saved}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Remove a member, as a list owner, or leave the list as yourself. An org member answers managed_by_unit
      operationId: removeListMember
      responses:
        "204": {description: Removed}
        default: {$ref: "#/components/responses/Error"}
  /v1/people:
    get:
      summary: Find an active teammate by display name
      operationId: findPeople
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: unit, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/limit"}
        - {$ref: "#/components/parameters/cursor"}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  people:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: {type: string}
                        display_name: {type: string, description: Unverified. Can be empty}
                        agent: {type: boolean, description: An agent teammate. Left out for a person}
                        org_unit_id: {type: string}
                  next_cursor: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /v1/units:
    get:
      summary: The tenant's org units
      operationId: listUnits
      responses:
        "200":
          description: The units
          content:
            application/json:
              schema:
                type: object
                properties:
                  units:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        parent_id: {type: string}
                        name: {type: string}
                        kind: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /v1/notifications:
    get:
      summary: Notifications after a cursor, oldest first
      description: Poll about every 30 seconds with the cursor from the last response.
      operationId: listNotifications
      parameters:
        - {name: after, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/limit"}
      responses:
        "200":
          description: New notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        read_at: {type: [string, "null"], format: date-time}
                        event: {$ref: "#/components/schemas/Event"}
                        target: {type: string, description: "The record this is about, as <module>:<type>:<id>"}
                  cursor: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /v1/notifications/read:
    post:
      summary: Mark the caller's notifications as read
      operationId: markNotificationsRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, items: {type: string}}
      responses:
        "204": {description: Marked}
        default: {$ref: "#/components/responses/Error"}
  /v1/settings:
    get:
      summary: Read tenant settings, for any member
      operationId: getSettings
      responses:
        "200": {$ref: "#/components/responses/Settings"}
        default: {$ref: "#/components/responses/Error"}
  /v1/admin/settings:
    put:
      summary: Change tenant settings, for a tenant admin
      operationId: putSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Settings"}
      responses:
        "200": {$ref: "#/components/responses/Settings"}
        default: {$ref: "#/components/responses/Error"}
  /v1/admin/agents/{user}/intake:
    parameters:
      - {name: user, in: path, required: true, schema: {type: string}, description: An agent account's user ID, which starts with acc_}
    get:
      summary: Who may offer work to an agent account, for a tenant admin
      description: An agent account's reporting line can always assign it work. With nothing set, nobody else can offer it any. A user who isn't an agent account answers 404.
      operationId: getAgentIntake
      responses:
        "200": {$ref: "#/components/responses/Intake"}
        default: {$ref: "#/components/responses/Error"}
    put:
      summary: Replace who may offer work to an agent account, for a tenant admin
      description: A unit takes work from members of the units beneath it too, and a list from its members. Each list must exist. Sends to the account that nobody here allows answer 403 not_accepting.
      operationId: putAgentIntake
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Intake"}
      responses:
        "200": {$ref: "#/components/responses/Intake"}
        default: {$ref: "#/components/responses/Error"}
  /v1/admin/departures:
    get:
      summary: Items nobody can act on, oldest first, for a tenant admin
      description: Titles and owners only. Closed items stay out, and come back if someone reopens them.
      operationId: listItemQueue
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/limit"}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/QueuedItem"}}
                  next_cursor: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /v1/admin/departures/{item}/reassign:
    post:
      summary: Give a queued item a new owner, for a tenant admin
      description: Needs no acceptance. Replaces every owner, and a suspended owner stays on as a collaborator. Anything not in the queue answers 404.
      operationId: reassignItem
      parameters:
        - {name: item, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewOwner"}
      responses:
        "200":
          description: Reassigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  title: {type: string}
                  owners: {type: array, items: {type: string}}
        default: {$ref: "#/components/responses/Error"}
  /v1/admin/departures/lists:
    get:
      summary: Lists nobody can manage, oldest first, for a tenant admin
      operationId: listListQueue
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/limit"}
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  lists: {type: array, items: {$ref: "#/components/schemas/QueuedList"}}
                  next_cursor: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /v1/admin/departures/lists/{id}/owner:
    post:
      summary: Give a queued list a new owner, for a tenant admin
      description: Anything not in the queue answers 404.
      operationId: setListOwner
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewOwner"}
      responses:
        "204": {description: Done}
        default: {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  parameters:
    id: {name: id, in: path, required: true, schema: {type: string}}
    limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    cursor: {name: cursor, in: query, schema: {type: string}}
  responses:
    Item:
      description: The item
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Item"}
    List:
      description: The list
      content:
        application/json:
          schema: {$ref: "#/components/schemas/List"}
    Intake:
      description: Who may offer work to an agent account
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Intake"}
    Settings:
      description: The settings
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Settings"}
    Offer:
      description: The offer
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Offer"}
    Error:
      description: An error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {$ref: "#/components/schemas/ErrorCode"}
              message: {type: string}
  schemas:
    Intake:
      type: object
      properties:
        user_id: {type: string, readOnly: true}
        everyone: {type: boolean, description: Anyone in the tenant may offer it work}
        units: {type: array, maxItems: 50, items: {type: string}, description: Members of these org units and the units beneath them}
        lists: {type: array, maxItems: 50, items: {type: string}, description: Members of these shared lists}
    Status: {type: string, enum: [todo, doing, done, cancelled]}
    Priority: {type: string, enum: [low, normal, high]}
    NewItem:
      type: object
      required: [title]
      properties:
        title: {type: string, maxLength: 300}
        description: {type: string, maxLength: 20000}
        priority: {$ref: "#/components/schemas/Priority"}
        due_at: {type: string, format: date-time}
        client_ref: {type: string, description: A retry with the same value returns the first item}
        send: {$ref: "#/components/schemas/Send"}
        list_id: {type: string, description: Puts the item on a list the caller is on}
        unowned: {type: boolean, description: Starts a list item with no owner}
    List:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        org_unit_id: {type: string}
        created_at: {type: string, format: date-time}
        archived_at: {type: [string, "null"], format: date-time}
        members:
          type: array
          description: Filled on a single read
          items:
            type: object
            properties:
              user_id: {type: string}
              role: {type: string, enum: [owner, member]}
              source: {type: string, enum: [manual, org]}
        counts:
          type: object
          description: Filled on the caller's page of lists
          properties:
            open: {type: integer, description: Items to do or in progress}
            unclaimed: {type: integer, description: Open items nobody owns}
            members: {type: integer}
    Settings:
      type: object
      required: [manager_visibility]
      properties:
        manager_visibility: {type: string, enum: [none, direct_reports, all_reports]}
    NewOwner:
      type: object
      required: [to]
      properties:
        to: {type: string, description: An active member of the tenant}
    QueuedItem:
      type: object
      properties:
        id: {type: string}
        title: {type: string}
        status: {$ref: "#/components/schemas/Status"}
        owners: {type: array, items: {type: string}}
        reason: {type: string, enum: [no_successor, owner_suspended]}
        queued_at: {type: string, format: date-time}
    QueuedList:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        reason: {type: string, enum: [no_active_owner, no_active_members]}
        queued_at: {type: string, format: date-time}
    Send:
      type: object
      required: [to]
      properties:
        to: {type: string}
        mode: {type: string, enum: [transfer, share], default: transfer}
        note: {type: string, maxLength: 2000}
        client_ref: {type: string, description: A retry with the same value returns the first send}
    Item:
      type: object
      properties:
        id: {type: string}
        title: {type: string}
        description: {type: string}
        status: {$ref: "#/components/schemas/Status"}
        priority: {$ref: "#/components/schemas/Priority"}
        due_at: {type: [string, "null"], format: date-time}
        creator_id: {type: string}
        list_id: {type: string}
        version: {type: integer}
        owners: {type: array, items: {type: string}}
        collaborators: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        suggestion:
          type: object
          description: A send an assistant suggested, for an owner to make. Only owners are shown it, and any send clears it
          properties:
            to: {type: string}
            note: {type: string}
            at: {type: string, format: date-time}
        links: {type: array, items: {$ref: "#/components/schemas/Link"}}
    Link:
      type: object
      properties:
        id: {type: string}
        url: {type: string}
        title: {type: string}
        kind: {type: string, enum: [pull_request, commit, build, document, other]}
        added_by: {type: string}
        created_at: {type: string, format: date-time}
    Offer:
      type: object
      properties:
        id: {type: string}
        item_id: {type: string}
        item_title: {type: string, description: Empty once the caller can't see the item}
        from_user_id: {type: string, description: "system:sweep when a departed owner's item is being offered on"}
        to_user_id: {type: string}
        mode: {type: string, enum: [transfer, share]}
        note: {type: string}
        state: {type: string, enum: [pending, assigned, accepted, declined, withdrawn, voided, expired]}
        expires_at: {type: [string, "null"], format: date-time, description: Set only on an offer holding a departed owner's item}
        response_note: {type: string}
        responded_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    Comment:
      type: object
      properties:
        id: {type: string}
        author_id: {type: string}
        body: {type: string}
        created_at: {type: string, format: date-time}
    Event:
      type: object
      properties:
        id: {type: string}
        item_id: {type: string}
        actor_user_id: {type: string}
        actor_grant_id: {type: string, description: "Set when an agent acted for the person"}
        kind: {type: string}
        detail: {type: object}
        at: {type: string, format: date-time}
    ErrorCode:
      type: string
      enum:
        - agent_loop
        - already_owned
        - already_owner
        - client_ref_reused
        - forbidden
        - internal_error
        - invalid_recipient
        - invalid_request
        - invalid_token
        - item_closed
        - invalid_unit
        - last_list_owner
        - last_owner
        - list_archived
        - too_many_links
        - managed_by_unit
        - not_accepting
        - not_found
        - offer_exists
        - offer_not_pending
        - org_unavailable
        - rate_limited
        - version_conflict
