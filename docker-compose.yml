# Local development only. Needs auth-server's stack running on the host.
services:
  postgres:
    image: postgres:17-alpine
    container_name: t10-collab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: "${COLLAB_DB_PASSWORD:-collab-dev-password}"
      POSTGRES_DB: collab
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab"]
      interval: 2s
      timeout: 3s
      retries: 20

  t10-collab:
    build: .
    container_name: t10-collab
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://collab:${COLLAB_DB_PASSWORD:-collab-dev-password}@postgres:5432/collab?sslmode=disable"
      # Tokens name localhost as their issuer, but the container reaches auth
      # through the host.
      AUTH_ISSUER: http://localhost:8081
      AUTH_URL: http://host.docker.internal:8081
      AUTH_CLIENT_SECRET: "${AUTH_T10_COLLAB_SECRET:-dev-only-t10-collab-service-secret-change-me}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8082/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
